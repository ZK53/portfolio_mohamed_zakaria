<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121D24"/>
      <stop offset="100%" stop-color="#1B262C"/>
    </linearGradient>
    <linearGradient id="todoHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#03A791"/>
      <stop offset="100%" stop-color="#255F38"/>
    </linearGradient>
    <filter id="phoneShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background presentation container -->
  <rect width="600" height="380" fill="url(#todoBg)" rx="16"/>
  <circle cx="510" cy="70" r="140" fill="#03A791" opacity="0.08"/>
  <circle cx="90" cy="310" r="130" fill="#E9F5BE" opacity="0.06"/>

  <!-- Left: Featured highlights -->
  <g transform="translate(40, 60)">
    <text x="0" y="30" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">FLUTTER • SQLITE • PERSISTENCE</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">To-Do App</text>
    <text x="0" y="105" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      <tspan x="0" dy="0">High-performance productivity app</tspan>
      <tspan x="0" dy="24">with local SQLite database CRUD,</tspan>
      <tspan x="0" dy="24">category filters, and reactive Cubit state.</tspan>
    </text>

    <!-- Mini Feature Badges -->
    <g transform="translate(0, 185)">
      <rect width="85" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="42" y="20" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">SQLite</text>
      
      <rect x="95" width="85" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="137" y="20" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Cubit</text>

      <rect y="40" width="130" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="65" y="60" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">SharedPreferences</text>
    </g>
  </g>

  <!-- Right: Sleek Mobile Phone Mockup -->
  <g transform="translate(340, 24)" filter="url(#phoneShadow3)">
    <!-- Phone Bezel -->
    <rect width="210" height="332" rx="32" fill="#0C141A" stroke="#25353D" stroke-width="4"/>
    <!-- Screen -->
    <rect x="8" y="8" width="194" height="316" rx="24" fill="#0F1722"/>

    <!-- Dynamic Island -->
    <rect x="75" y="14" width="60" height="12" rx="6" fill="#000000"/>

    <!-- App Top Bar -->
    <rect x="8" y="32" width="194" height="42" fill="url(#todoHeader)"/>
    <text x="24" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">My Tasks</text>
    <circle cx="180" cy="52" r="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="180" y="56" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+</text>

    <!-- Task Progress Summary Card -->
    <g transform="translate(18, 82)">
      <rect width="174" height="48" rx="10" fill="#182533" stroke="#233B4D" stroke-width="1"/>
      <text x="12" y="22" fill="#FFFFFF" font-size="10" font-weight="700" font-family="sans-serif">Daily Progress</text>
      <text x="12" y="38" fill="#81E7AF" font-size="8.5" font-weight="600" font-family="sans-serif">5 of 7 completed (71%)</text>
      
      <!-- Progress Bar Track -->
      <rect x="100" y="20" width="62" height="8" rx="4" fill="#0B131B"/>
      <rect x="100" y="20" width="44" height="8" rx="4" fill="#03A791"/>
    </g>

    <!-- Task Item 1: Done -->
    <g transform="translate(18, 138)">
      <rect width="174" height="40" rx="8" fill="#14202C" stroke="#1F3242" stroke-width="1"/>
      <circle cx="20" cy="20" r="7" fill="#03A791"/>
      <!-- Checkmark -->
      <path d="M17 20 L19 22 L23 18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="34" y="20" fill="#94A3B8" font-size="8.5" font-family="sans-serif" text-decoration="line-through">Design MVVM Data Layer</text>
      <text x="34" y="32" fill="#4B6375" font-size="7.5" font-family="sans-serif">SQLite Schema Migrated</text>
    </g>

    <!-- Task Item 2: Done -->
    <g transform="translate(18, 184)">
      <rect width="174" height="40" rx="8" fill="#14202C" stroke="#1F3242" stroke-width="1"/>
      <circle cx="20" cy="20" r="7" fill="#03A791"/>
      <path d="M17 20 L19 22 L23 18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="34" y="20" fill="#94A3B8" font-size="8.5" font-family="sans-serif" text-decoration="line-through">Integrate Cubit State</text>
      <text x="34" y="32" fill="#4B6375" font-size="7.5" font-family="sans-serif">Completed</text>
    </g>

    <!-- Task Item 3: In Progress -->
    <g transform="translate(18, 230)">
      <rect width="174" height="40" rx="8" fill="#182533" stroke="#03A791" stroke-width="1"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#81E7AF" stroke-width="2"/>
      <text x="34" y="20" fill="#FFFFFF" font-size="8.5" font-weight="600" font-family="sans-serif">Implement Task Priority Filter</text>
      <text x="34" y="32" fill="#81E7AF" font-size="7.5" font-family="sans-serif">Due Today • High</text>
    </g>

    <!-- Floating Action Button -->
    <circle cx="172" cy="292" r="18" fill="#03A791" filter="url(#phoneShadow3)"/>
    <text x="172" y="297" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">+</text>
  </g>
</svg>
