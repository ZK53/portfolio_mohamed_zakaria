<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A791" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#81E7AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E9F5BE" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A791"/>
      <stop offset="100%" stop-color="#028675"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81E7AF"/>
      <stop offset="100%" stop-color="#03A791"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9D4B8"/>
      <stop offset="100%" stop-color="#E6B898"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="200" cy="200" r="185"/>
    </clipPath>
  </defs>

  <!-- Circular Outer Frame Background -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)"/>

  <!-- Content clipped inside circular boundary -->
  <g clip-path="url(#circleClip)">
    <!-- Ambient geometric background elements -->
    <circle cx="90" cy="110" r="50" fill="#03A791" opacity="0.08"/>
    <circle cx="330" cy="280" r="70" fill="#81E7AF" opacity="0.12"/>
    <rect x="50" y="270" width="60" height="60" rx="14" fill="#03A791" opacity="0.06" transform="rotate(25 80 300)"/>

    <!-- Developer Character Illustration -->
    <!-- Torso / Hoodie -->
    <path d="M110 390 C110 300 135 285 160 280 L200 310 L240 280 C265 285 290 300 290 390 Z" fill="#182A24"/>
    <!-- Hoodie details & zip -->
    <path d="M160 280 L200 310 L240 280" fill="none" stroke="#26443A" stroke-width="4"/>
    <line x1="200" y1="310" x2="200" y2="400" stroke="#03A791" stroke-width="3"/>
    <!-- Flutter Dash Accent Pin on chest -->
    <path d="M152 325 L165 312 L172 319 L159 332 Z" fill="#03A791"/>
    <path d="M165 332 L175 322 L179 326 L169 336 Z" fill="#81E7AF"/>

    <!-- Neck -->
    <rect x="182" y="225" width="36" height="58" rx="10" fill="url(#skinGrad)"/>
    <path d="M182 250 C190 262 210 262 218 250 Z" fill="#D4A381" opacity="0.5"/>

    <!-- Head / Face -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="url(#skinGrad)"/>
    <!-- Ears -->
    <ellipse cx="143" cy="182" rx="9" ry="15" fill="#E6B898"/>
    <ellipse cx="257" cy="182" rx="9" ry="15" fill="#E6B898"/>

    <!-- Hair -->
    <path d="M142 165 C140 120 165 105 200 105 C235 105 260 120 258 165 C255 145 240 125 200 125 C160 125 145 145 142 165 Z" fill="url(#hairGrad)"/>
    <path d="M145 155 C148 135 170 122 200 122 C230 122 252 135 255 155 C245 130 220 116 195 118 C170 120 152 138 145 155 Z" fill="#2D3748"/>

    <!-- Eyebrows -->
    <path d="M163 158 Q176 153 187 157" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M213 157 Q224 153 237 158" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Modern Developer Glasses -->
    <rect x="156" y="163" width="36" height="26" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <rect x="208" y="163" width="36" height="26" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="192" y1="174" x2="208" y2="174" stroke="#0F172A" stroke-width="3.5"/>
    <line x1="145" y1="172" x2="156" y2="173" stroke="#0F172A" stroke-width="3"/>
    <line x1="244" y1="173" x2="255" y2="172" stroke="#0F172A" stroke-width="3"/>

    <!-- Eyes (focused, friendly) -->
    <circle cx="174" cy="176" r="4.5" fill="#1E293B"/>
    <circle cx="176" cy="174" r="1.5" fill="#FFFFFF"/>
    <circle cx="226" cy="176" r="4.5" fill="#1E293B"/>
    <circle cx="228" cy="174" r="1.5" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M198 180 L195 197 Q199 200 203 197" fill="none" stroke="#C99472" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M186 212 Q200 223 214 212" fill="none" stroke="#A86E4B" stroke-width="3" stroke-linecap="round"/>

    <!-- Clean Tech Floating Badges -->
    <g transform="translate(48, 160)">
      <rect width="64" height="28" rx="14" fill="#03A791" filter="url(#subtleGlow)"/>
      <text x="32" y="18" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Flutter</text>
    </g>

    <g transform="translate(290, 160)">
      <rect width="58" height="28" rx="14" fill="#81E7AF" filter="url(#subtleGlow)"/>
      <text x="29" y="18" fill="#0E3725" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dart</text>
    </g>

    <g transform="translate(270, 240)">
      <rect width="68" height="26" rx="13" fill="#1E293B" opacity="0.9"/>
      <text x="34" y="17" fill="#81E7AF" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">MVVM</text>
    </g>

    <g transform="translate(65, 240)">
      <rect width="66" height="26" rx="13" fill="#1E293B" opacity="0.9"/>
      <text x="33" y="17" fill="#E9F5BE" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">Cubit</text>
    </g>
  </g>
</svg>
