<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C24"/>
      <stop offset="100%" stop-color="#1B2B28"/>
    </linearGradient>
    <linearGradient id="ecomHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F7D53"/>
      <stop offset="100%" stop-color="#03A791"/>
    </linearGradient>
    <linearGradient id="prodCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="phoneShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background presentation container -->
  <rect width="600" height="380" fill="url(#ecomBg)" rx="16"/>
  <circle cx="520" cy="90" r="150" fill="#81E7AF" opacity="0.07"/>
  <circle cx="90" cy="300" r="130" fill="#03A791" opacity="0.08"/>

  <!-- Left: Featured highlights -->
  <g transform="translate(40, 60)">
    <text x="0" y="30" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1.5">FLUTTER • FIREBASE • FIRESTORE</text>
    <text x="0" y="70" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">E-Commerce App</text>
    <text x="0" y="105" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">
      <tspan x="0" dy="0">Complete mobile shopping solution</tspan>
      <tspan x="0" dy="24">with Firebase Auth, live Firestore sync,</tspan>
      <tspan x="0" dy="24">cart, wishlist, and profile management.</tspan>
    </text>

    <!-- Mini Feature Badges -->
    <g transform="translate(0, 185)">
      <rect width="115" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="57" y="20" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Firebase Auth</text>
      
      <rect x="125" width="85" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="167" y="20" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Firestore</text>

      <rect y="40" width="80" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="40" y="60" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">MVVM</text>

      <rect x="90" y="40" width="80" height="30" rx="15" fill="#03A791" fill-opacity="0.2" stroke="#03A791" stroke-width="1"/>
      <text x="130" y="60" fill="#81E7AF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Cubit</text>
    </g>
  </g>

  <!-- Right: Sleek Mobile Phone Mockup -->
  <g transform="translate(340, 24)" filter="url(#phoneShadow2)">
    <!-- Phone Bezel -->
    <rect width="210" height="332" rx="32" fill="#0A1116" stroke="#26382F" stroke-width="4"/>
    <!-- Screen -->
    <rect x="8" y="8" width="194" height="316" rx="24" fill="#101C16"/>

    <!-- Dynamic Island -->
    <rect x="75" y="14" width="60" height="12" rx="6" fill="#000000"/>

    <!-- App Top Bar -->
    <rect x="8" y="32" width="194" height="42" fill="url(#ecomHeader)"/>
    <text x="24" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Flutter Store</text>
    <!-- Cart Icon with badge -->
    <circle cx="180" cy="52" r="10" fill="#FFFFFF" fill-opacity="0.2"/>
    <circle cx="186" cy="46" r="4" fill="#FF5252"/>

    <!-- Search input -->
    <rect x="18" y="82" width="174" height="26" rx="8" fill="#1C2E24" stroke="#255F38" stroke-width="1"/>
    <text x="30" y="99" fill="#859D80" font-size="9" font-family="sans-serif">Search sneakers, apparel...</text>

    <!-- Promo Banner -->
    <g transform="translate(18, 116)">
      <rect width="174" height="52" rx="10" fill="#1F7D53"/>
      <text x="14" y="24" fill="#E9F5BE" font-size="10" font-weight="800" font-family="sans-serif">SUMMER SALE - 30% OFF</text>
      <text x="14" y="38" fill="#FFFFFF" font-size="8" font-family="sans-serif">Firestore dynamic inventory</text>
    </g>

    <!-- Product Grid Mini Cards -->
    <!-- Card 1 -->
    <g transform="translate(18, 176)">
      <rect width="82" height="92" rx="8" fill="#17261D" stroke="#255F38" stroke-width="1"/>
      <rect x="6" y="6" width="70" height="46" rx="6" fill="#255F38" fill-opacity="0.3"/>
      <!-- Heart Wishlist Icon -->
      <circle cx="68" cy="14" r="5" fill="#FF5252" fill-opacity="0.8"/>
      <text x="8" y="64" fill="#FFFFFF" font-size="8" font-weight="700" font-family="sans-serif">Pro Runner X</text>
      <text x="8" y="76" fill="#81E7AF" font-size="8.5" font-weight="700" font-family="sans-serif">$89.00</text>
      <rect x="58" y="66" width="18" height="18" rx="5" fill="#03A791"/>
      <text x="67" y="79" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(110, 176)">
      <rect width="82" height="92" rx="8" fill="#17261D" stroke="#255F38" stroke-width="1"/>
      <rect x="6" y="6" width="70" height="46" rx="6" fill="#255F38" fill-opacity="0.3"/>
      <circle cx="68" cy="14" r="5" fill="#3D5347"/>
      <text x="8" y="64" fill="#FFFFFF" font-size="8" font-weight="700" font-family="sans-serif">Air Glide 4</text>
      <text x="8" y="76" fill="#81E7AF" font-size="8.5" font-weight="700" font-family="sans-serif">$120.00</text>
      <rect x="58" y="66" width="18" height="18" rx="5" fill="#03A791"/>
      <text x="67" y="79" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">+</text>
    </g>

    <!-- Bottom Navigation Bar (Shop, Wishlist, Cart, Profile) -->
    <rect x="8" y="278" width="194" height="46" fill="#0C1510"/>
    <circle cx="36" cy="300" r="5" fill="#81E7AF"/>
    <circle cx="78" cy="300" r="4" fill="#3D5347"/>
    <circle cx="120" cy="300" r="4" fill="#3D5347"/>
    <circle cx="162" cy="300" r="4" fill="#3D5347"/>
  </g>
</svg>
